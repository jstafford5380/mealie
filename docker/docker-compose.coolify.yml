services:
  mealie:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "9000"
    ports:
      - "18180:9000"
    environment:
      BASE_URL: ${BASE_URL:?}
      ALLOW_SIGNUP: "false"
      LOG_LEVEL: INFO
      DB_ENGINE: sqlite
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
      MCP_OAUTH_AUDIENCE: ${MCP_OAUTH_AUDIENCE:-}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_JWKS_URL: ${MCP_OAUTH_JWKS_URL:-}
      MCP_OAUTH_SUBJECT: ${MCP_OAUTH_SUBJECT:-}
      MCP_USER_ID: ${MCP_USER_ID:-}
      MCP_TUNNEL_ACCESS_TOKEN: ${MCP_TUNNEL_ACCESS_TOKEN:-}
    volumes:
      - mealie-data:/app/data

  mealie-tunnel:
    image: ghcr.io/openai/tunnel-client:v0.0.21
    profiles: ["mcp-tunnel"]
    restart: unless-stopped
    network_mode: "service:mealie"
    depends_on:
      mealie:
        condition: service_healthy
        restart: true
    environment:
      CONTROL_PLANE_TUNNEL_ID: ${OPENAI_MCP_TUNNEL_ID:-}
      CONTROL_PLANE_API_KEY: ${OPENAI_MCP_TUNNEL_KEY:-}
      MCP_SERVER_URL: http://127.0.0.1:9000/mcp
      MCP_EXTRA_HEADERS: "X-Mealie-Tunnel-Token: env:MCP_TUNNEL_ACCESS_TOKEN"
      MCP_TUNNEL_ACCESS_TOKEN: ${MCP_TUNNEL_ACCESS_TOKEN:-}
      MCP_OAUTH_TRUSTED_ORIGINS: ${MCP_OAUTH_ISSUER:-}
      HARPOON_ALLOW_PLAINTEXT_HTTP: "true"

volumes:
  mealie-data:
