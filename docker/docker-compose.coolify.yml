services:
  mealie:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "9000"
    ports:
      - "18180:9000"
    environment:
      BASE_URL: ${BASE_URL:?}
      ALLOW_SIGNUP: "false"
      LOG_LEVEL: INFO
      DB_ENGINE: sqlite
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
      MCP_OAUTH_AUDIENCE: ${MCP_OAUTH_AUDIENCE:-}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_JWKS_URL: ${MCP_OAUTH_JWKS_URL:-}
      MCP_OAUTH_SUBJECT: ${MCP_OAUTH_SUBJECT:-}
      MCP_USER_ID: ${MCP_USER_ID:-}
    volumes:
      - mealie-data:/app/data

volumes:
  mealie-data:
